name: SAC Source Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-source-foundation:
    name: Validate SAC source foundation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required project files
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            "SAC.uproject"
            "Source/SAC/SAC.Build.cs"
            "Source/SAC/SACEnvironmentController.h"
            "Source/SAC/SACEnvironmentController.cpp"
            "Source/SAC/SACCloudField.h"
            "Source/SAC/SACCloudField.cpp"
            "Source/SAC/SACWaterRippleComponent.h"
            "Source/SAC/SACWaterRippleComponent.cpp"
            "Source/SAC/SACOceanSurface.h"
            "Source/SAC/SACOceanSurface.cpp"
            "Content/SourceAssets/Water/SAC_WaterRippleNormal.hlsl"
            "Docs/WATER_MATERIAL_IMPLEMENTATION.md"
            "Docs/ENVIRONMENT_MILESTONE_01.md"
            "Docs/CLOUD_FIELD_ACTOR.md",
            "Docs/CLOUD_MESH_UPGRADE_02.md",
            "Tools/generate_cloud_meshes.py"
          )
          for file in "${required_files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error file=$file::Required file is missing or empty"
              exit 1
            fi
            echo "OK: $file"
          done

      - name: Check water ripple parameter contract
        shell: bash
        run: |
          set -euo pipefail
          header="Source/SAC/SACWaterRippleComponent.h"
          source="Source/SAC/SACWaterRippleComponent.cpp"

          grep -Eq 'RippleSlotCount[[:space:]]*=[[:space:]]*4' "$header" || {
            echo "::error::C++ ripple component must define exactly four event slots"
            exit 1
          }
          grep -Fq 'FString::Printf(TEXT("SAC_Ripple%d_"), Index)' "$source" || {
            echo "::error::C++ ripple component is missing its indexed material-parameter prefix"
            exit 1
          }
          for parameter in Origin Age Strength Speed Width; do
            grep -Fq "TEXT(\"${parameter}\")" "$source" || {
              echo "::error::C++ ripple component is missing parameter suffix ${parameter}"
              exit 1
            }
          done
          echo "C++ exposes five material parameters across four indexed ripple slots."

      - name: Check water shader has four event inputs
        shell: bash
        run: |
          set -euo pipefail
          for slot in 0 1 2 3; do
            grep -Fq "SAC_ACCUMULATE_RIPPLE(Origin${slot}" Content/SourceAssets/Water/SAC_WaterRippleNormal.hlsl || {
              echo "::error::Ripple shader is missing event slot ${slot}"
              exit 1
            }
          done
          echo "All four ripple event slots are present."

      - name: Check layered cloud field source contract
        shell: bash
        run: |
          set -euo pipefail
          header="Source/SAC/SACCloudField.h"
          source="Source/SAC/SACCloudField.cpp"
          for layer in Near Mid Far; do
            grep -Fq "${layer}CloudInstances" "$header" || {
              echo "::error::Cloud field is missing the ${layer} instance layer"
              exit 1
            }
            grep -Fq "${layer}CloudMesh" "$header" || {
              echo "::error::Cloud field is missing the ${layer} mesh assignment"
              exit 1
            }
          done
          grep -Fq "FRandomStream Random(LayerSeed)" "$source"
          grep -Fq "InstanceComponent->AddInstance" "$source"
          grep -Fq "SetCollisionEnabled(ECollisionEnabled::NoCollision)" "$source"
          echo "Three deterministic, non-colliding cloud instance layers are present."


      - name: Validate Blender cloud mesh generator
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile Tools/generate_cloud_meshes.py
          grep -Fq 'meta = bpy.data.metaballs.new' Tools/generate_cloud_meshes.py
          grep -Fq 'bpy.ops.object.convert(target="MESH")' Tools/generate_cloud_meshes.py
          grep -Fq 'SAC_CloudBank_02' Tools/generate_cloud_meshes.py
          grep -Fq 'SAC_CloudTower_02' Tools/generate_cloud_meshes.py
          grep -Fq 'SAC_CloudShelf_02' Tools/generate_cloud_meshes.py
          echo "Blender generator syntax and three cloud definitions validated."

      - name: Confirm this is source validation, not an Unreal build
        shell: bash
        run: |
          echo "Source and contract checks passed."
          echo "This runner does not contain Unreal Engine; it does not compile SAC or package an APK."
