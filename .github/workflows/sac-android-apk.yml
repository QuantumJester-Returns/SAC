name: SAC Android APK
on:
  push:
    branches: [main]
    paths:
      - 'Godot/**'
      - '.github/workflows/sac-android-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: sac-android-apk
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;23.2.8568313"

      - name: Install Godot 4.4.1 and Android export templates
        run: |
          curl -L --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v4.4.1-stable_linux.x86_64
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          curl -L --retry 3 -o templates.tpz https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          unzip -q templates.tpz -d template-unpack
          cp -a template-unpack/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

      - name: Load permanent SAC signing key
        env:
          SAC_ANDROID_KEYSTORE_BASE64: ${{ secrets.SAC_ANDROID_KEYSTORE_BASE64 }}
          SAC_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SAC_ANDROID_KEYSTORE_PASSWORD }}
          SAC_ANDROID_KEY_ALIAS: ${{ secrets.SAC_ANDROID_KEY_ALIAS }}
          SAC_ANDROID_KEY_PASSWORD: ${{ secrets.SAC_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SAC_ANDROID_KEYSTORE_BASE64" || { echo "Missing SAC_ANDROID_KEYSTORE_BASE64 repository secret"; exit 1; }
          test -n "$SAC_ANDROID_KEYSTORE_PASSWORD" || { echo "Missing SAC_ANDROID_KEYSTORE_PASSWORD repository secret"; exit 1; }
          test -n "$SAC_ANDROID_KEY_ALIAS" || { echo "Missing SAC_ANDROID_KEY_ALIAS repository secret"; exit 1; }
          test -n "$SAC_ANDROID_KEY_PASSWORD" || { echo "Missing SAC_ANDROID_KEY_PASSWORD repository secret"; exit 1; }
          mkdir -p "$RUNNER_TEMP/sac-signing"
          KEYSTORE="$RUNNER_TEMP/sac-signing/SAC-Android-Signing-Key.jks"
          printf '%s' "$SAC_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$SAC_ANDROID_KEYSTORE_PASSWORD" -alias "$SAC_ANDROID_KEY_ALIAS" >/dev/null
          # Godot's Android exporter exposes one password field. Align the private-key
          # password with the keystore password on this ephemeral runner copy.
          keytool -keypasswd -keystore "$KEYSTORE" -storepass "$SAC_ANDROID_KEYSTORE_PASSWORD" -alias "$SAC_ANDROID_KEY_ALIAS" -keypass "$SAC_ANDROID_KEY_PASSWORD" -new "$SAC_ANDROID_KEYSTORE_PASSWORD"
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$KEYSTORE"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=$SAC_ANDROID_KEY_ALIAS"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=$SAC_ANDROID_KEYSTORE_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Configure Godot Android SDK paths
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "/usr/local/lib/android/sdk"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          test -x "$JAVA_HOME/bin/java"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/build-tools/34.0.0/apksigner"

      - name: Import project and export Android APK
        run: |
          set -euo pipefail
          mkdir -p Godot/build
          sed -i "s/^version\/code=.*/version\/code=$GITHUB_RUN_NUMBER/" Godot/export_presets.cfg
          godot-bin/Godot_v4.4.1-stable_linux.x86_64 --headless --editor --path Godot --quit
          godot-bin/Godot_v4.4.1-stable_linux.x86_64 --headless --path Godot --export-debug "Android" build/SAC-Android-debug.apk

      - name: Verify APK output
        run: |
          test -s Godot/build/SAC-Android-debug.apk
          ls -lh Godot/build/SAC-Android-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SAC-Android-debug
          path: Godot/build/SAC-Android-debug.apk
          if-no-files-found: error
          retention-days: 14
