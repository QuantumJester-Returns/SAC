name: SAC Environment Preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Tools/blender/**'
      - '.github/workflows/sac-environment-preview.yml'
permissions:
  contents: write
concurrency:
  group: sac-environment-preview
  cancel-in-progress: true
jobs:
  blender-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender libegl1 libgl1 libxkbcommon0
          blender --version
      - name: Generate and render SAC environment
        run: |
          mkdir -p output
          SAC_RENDER_ENGINE=CYCLES SAC_OUTPUT="$PWD/output/SAC_Environment_Preview.png" SAC_BLEND="$PWD/output/SAC_Environment_Study.blend" blender -b -t 2 --python Tools/blender/generate_sac_environment.py
      - name: Publish generated source assets to repository
        run: |
          mkdir -p Content/SourceAssets/Generated
          cp output/SAC_Cloud_Field.obj output/SAC_Cloud_Field.mtl Content/SourceAssets/Generated/
          cp output/SAC_Ocean_Surface.obj output/SAC_Ocean_Surface.mtl Content/SourceAssets/Generated/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Content/SourceAssets/Generated/
          if ! git diff --cached --quiet; then
            git commit -m "Add generated SAC environment source assets"
            git push
          fi
      - name: Check Unreal Engine availability
        shell: bash
        run: |
          if command -v UnrealEditor >/dev/null 2>&1 || command -v UnrealEditor-Cmd >/dev/null 2>&1; then
            echo "Unreal Engine executable detected."
          else
            echo "::notice::This GitHub-hosted runner does not have Unreal Engine installed. Blender preview is real; this job does not claim to compile or render the UE5 project."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: SAC-Environment-Preview
          path: output/
          if-no-files-found: error
          retention-days: 14
