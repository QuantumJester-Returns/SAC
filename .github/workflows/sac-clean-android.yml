name: SAC Clean Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - sac-godot-clean-rebuild
    paths:
      - 'SAC-Godot/**'
      - '.github/workflows/sac-clean-android.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout clean rebuild branch
        uses: actions/checkout@v4
        with:
          ref: sac-godot-clean-rebuild

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android build tools
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download Godot 4.7.2
        run: |
          mkdir -p "$HOME/godot" "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          curl -L --fail -o "$HOME/godot/godot.zip" "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q "$HOME/godot/godot.zip" -d "$HOME/godot"
          sudo install "$HOME/godot/Godot_v4.7.2-stable_linux.x86_64" /usr/local/bin/godot
          curl -L --fail -o "$HOME/godot/templates.tpz" "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          mkdir -p "$HOME/godot/templates"
          unzip -q "$HOME/godot/templates.tpz" -d "$HOME/godot/templates"
          cp -a "$HOME/godot/templates/templates/." "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Create temporary debug signing key
        run: |
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000

      - name: Import and validate project
        run: |
          godot --version
          godot --headless --editor --path SAC-Godot --quit
          godot --headless --path SAC-Godot --quit-after 3

      - name: Export landscape Android APK
        run: |
          mkdir -p SAC-Godot/build
          godot --headless --path SAC-Godot --export-debug "Android" SAC-Godot/build/SeaAmongTheClouds.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sea-Among-The-Clouds-Android-landscape
          path: SAC-Godot/build/SeaAmongTheClouds.apk
          if-no-files-found: error
